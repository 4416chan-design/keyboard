name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mobile & TV IME Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APKs (:app and :tv-ime)
        run: gradle :app:assembleDebug :tv-ime:assembleDebug --no-daemon --stacktrace

      - name: Upload Mobile Remote App APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-tv-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload TV IME Service APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-ime-service-debug-apk
          path: tv-ime/build/outputs/apk/debug/*.apk
